<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f6fb" media="(prefers-color-scheme: light)" />
    <title>Eevie</title>
    <meta name="description" content="Track what your EV really costs to run, and what the same driving would have cost in petrol." />
    <script>
      // Stamp the theme before first paint so there is no flash of the
      // wrong mode. Must mirror initialTheme() in src/hooks/useTheme.tsx.
      (function () {
        try {
          var s = localStorage.getItem('ev-platform-theme')
          var dark = s === 'dark' || (s !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
