server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Asset filenames carry a content hash, so a given URL never changes and
    # can be kept forever. This is the half that makes the next rule safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must never be held: it is the file naming which hashed
        # bundles to load. A cached copy points at assets that no longer exist,
        # which is a blank screen rather than an old version.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
